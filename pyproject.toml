[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-fit"
version = "3.0.0"
description = "dmipy-fit: analytical diffusion-microstructure signal models + JAX GPU fitting"
readme = "README.md"
license = { text = "AGPL-3.0-only OR LicenseRef-Commercial" }  # dual-licensed; see LICENSING.md
authors = [
    { name = "Rutger Fick", email = "fick.rutger@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "dmipy-sim>=3,<4",       # the forward engine: the replay packs, the exact SH forms, the matrix method, the substrate catalogue
    "dmipy-replay>=0.2,<0.3",  # the acquisition object, its builders, the gradient conversions, GAMMA, the pack reader
    "numpy>=2.0",
    "scipy>=1.10",
    "packaging>=23.0",
]

[project.optional-dependencies]
jax = [
    "jax[cpu]>=0.6.2",
    "jaxopt>=0.8",
]
# GPU fitting (whole slice on device). Needs a working CUDA 12 stack; see the
# dmipy-sim README / dmipy.org install page for the LD_LIBRARY_PATH note.
# The PyTorch backend of the batched Tournier CSD (solver='csd_tournier07_torch', dmipy-fit#37).
torch = [
    "torch>=2.2",
]
jax-gpu = [
    "jax[cuda12]>=0.6.2",
    "jaxopt>=0.8",
]
speed = [
    "numba>=0.57",
]
data = [
    "nibabel>=5.0",
]
# the Hub-hosted replay families (dmipy_fit.data.mc_replay): the dataset download, the ranged HTTP reads, the pack container
hub = [
    "huggingface_hub>=0.20",
    "requests>=2.28",
    "safetensors>=0.4",
]
viz = [
    "fury>=0.10",
    "matplotlib>=3.5",
]
legacy = [
    "cvxpy>=1.3",
    "pathos>=0.3",
]
# dipy is the test oracle (the SH basis, the sphere, the peaks, the tensor fit are checked against it) and the optional
# gradient-table interchange (gtab_dipy2dmipy, gtab_dmipy2dipy); no shipped code needs it
oracle = [
    "dipy>=1.7",
]
dev = [
    "dmipy-fit[oracle]",
    "pytest>=7",
    "pytest-cov",
    "nbmake",       # the tutorial notebooks CI executes
    "jupytext",
]
all = [
    "dmipy-fit[jax,speed,data,hub,viz,legacy]",
]

[project.urls]
Homepage = "https://github.com/dmrai-lab/dmipy-fit"
Repository = "https://github.com/dmrai-lab/dmipy-fit"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_fit*"]

[tool.setuptools.package-data]
dmipy_fit = [
    "data/gradient_tables/*",
    "data/spheres/*",
    "data/bingham_normalization_splinefit.npz",
    "data/sos_constraints/*",
    "data/mgh_1010/*",
    "data/hcp_191841/*",
    "data/mc_reference/*",
]

[tool.pytest.ini_options]
testpaths = ["dmipy_fit", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that take > 30 s (deselect with -m 'not slow')",
]
