name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "0 4 * * 1"     # weekly: the slow tests
  workflow_dispatch:

env:
  # The 3.0 line is not on PyPI yet (dmipy-sim 3.0, dmipy-replay 0.2): CI installs each from the commit this
  # revision was tested against (dmipy-sim: the head of dmipy-sim#852, which makes `simulate`'s pack state its
  # acquisition's scanner class). Move each ref forward when the releases land and `pip install` resolves them from
  # PyPI instead.
  DMIPY_SIM_REF: 88aff1869586e9edc5922ee909f4e9ed732aa8de
  DMIPY_REPLAY_REF: 38110c577804e8d122b556ac556d2214b5401262

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@${DMIPY_SIM_REF}" \
                      "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          # dmipy-fit's own bounds (dmipy-sim>=3,<4, dmipy-replay>=0.2,<0.3) name the releases above, so the package is
          # installed without resolving them and its extras are listed here.
          # dipy is the test oracle only (the `oracle` extra); the package never imports it
          pip install --no-deps -e .
          pip install "jax[cpu]>=0.6.2" "jaxopt>=0.8" "numba>=0.57" "nibabel>=5.0" "matplotlib>=3.5" "cvxpy>=1.3" \
                      "pathos>=0.3" "huggingface_hub>=0.20" "requests>=2.28" "safetensors>=0.4" \
                      "dipy>=1.7" "scipy>=1.10" "packaging>=23.0" pytest pytest-cov nbmake jupytext
          # the torch CSD solver is checked against the JAX one (dmipy-fit#37): the CPU wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: |
          pytest dmipy_fit/ tests/ -q --tb=short -m "not slow"

      - name: Run the slow tests
        if: matrix.python-version == '3.12' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          pytest dmipy_fit/ tests/ -q --tb=short -m slow

      - name: Execute lightweight tutorial notebooks (honesty check)
        if: matrix.python-version == '3.12'
        run: |
          # Executes the flagship canonical-WM parity page on CPU: the analytical
          # forward runs live and is asserted against the cached, step-resolved
          # Monte-Carlo reference (flagship_mc_reference.npz), so CPU CI stays fast.
          # nbmake collects .ipynb natively (the paired .md is the editable source).
          JAX_PLATFORMS=cpu pytest --nbmake -q \
            examples/flagship_canonical_wm/canonical_wm_parity.ipynb \
            examples/01_acquisition_schemes/waveform_first_acquisition_scheme.ipynb \
            examples/01_acquisition_schemes/loading_schemes_from_files_and_dipy.ipynb \
            examples/02_signal_models/build_multicompartment_model.ipynb \
            examples/03_fitting_and_optimization/simulating_and_fitting.ipynb \
            examples/03_fitting_and_optimization/ivim.ipynb \
            examples/05_distributed_models/noddi_watson.ipynb \
            examples/06_gpu_acceleration/jax_gpu_fitting.ipynb \
            examples/11_acquisition_families/btensor_microscopic_anisotropy.ipynb

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
